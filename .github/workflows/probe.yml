name: probe
on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14-intel, macos-13, macos-13-intel, macos-14-large, macos-15-xlarge]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Report image and Xcode versions
        run: |
          sw_vers || true
          echo "--- Xcode apps ---"
          ls -d /Applications/Xcode*.app 2>/dev/null | sort -V || echo none
          echo "--- selected ---"
          xcode-select -p || true
          xcodebuild -version 2>/dev/null || true
          echo "--- iig ---"
          xcrun --find iig 2>/dev/null && xcrun iig -version 2>/dev/null || true
